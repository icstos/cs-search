[project]
name = "cs-search"
version = "2.0.0"
description = "CSearch - Everything 1.5 极速文件搜索（Flet 声明式，Windows）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet==0.86.5",
    "everytools>=0.2.2",
    "requests>=2.31",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "Send2Trash>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["csearch", "csearch.ui"]
